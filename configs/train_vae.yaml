# Model params
model:
  input_channels: 10 # number of assets in Heston model
  patch_len: 8 # patch_dim = 8
  latent_dim: 128

# Optimization & KL regularizer
training:
  epochs: 50
  batch_size: 64
  lr: 1e-3
  beta: 1e-3
  seed: 42
  save_dir: "checkpoints/vae"

# Data
data:
  training:
    window_len: 64
    stride: 64
    normalize: true
    path: "data/processed/heston_train.npz"
